<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Graph Renderer Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: white;
            font-family: sans-serif;
        }

        #app {
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
        }

        input {
            padding: 5px;
            background: #333;
            border: 1px solid #555;
            color: white;
            width: 250px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
            background: #4488ff;
            border: none;
            color: white;
        }
    </style>
</head>

<body>
    <div id="ui">
        <h3>Graph Renderer</h3>
        <div>
            <input type="text" id="formula" value="sin(x) * cos(y)" />
            <button id="renderBtn">Render</button>
        </div>
        <div style="margin-top: 10px;">
            <label>Z-Clip Min: <input type="range" id="clipMin" min="-10" max="10" step="0.1" value="-10"
                    style="width: 100px;"></label>
            <br>
            <label>Z-Clip Max: <input type="range" id="clipMax" min="-10" max="10" step="0.1" value="10"
                    style="width: 100px;"></label>
        </div>
    </div>
    <div id="app"></div>

    <script type="module">
        import { GraphRenderer } from './src/index.ts';
        import { DEFAULT_THEME } from './src/config/ThemeConfig.ts';

        // Initialize renderer - WASM will be loaded automatically
        (async () => {
            try {
                // Create renderer (no factory needed - will auto-load from /wasm/)
                const renderer = new GraphRenderer();
                renderer.mount(document.getElementById('app'));

                // Wait for WASM to be fully initialized
                await renderer.isReady();
                console.log('✅ Renderer ready!');
                
                // Initial render with default expression
                renderer.setExpression("sin(sqrt(x^2 + y^2))");

                // Setup UI event handlers
                document.getElementById('renderBtn').addEventListener('click', () => {
                    const val = document.getElementById('formula').value;
                    renderer.setExpression(val);
                });

                const clipMin = document.getElementById('clipMin');
                const clipMax = document.getElementById('clipMax');

                function updateClip() {
                    renderer.setZClipping(parseFloat(clipMin.value), parseFloat(clipMax.value));
                }

                clipMin.addEventListener('input', updateClip);
                clipMax.addEventListener('input', updateClip);
            } catch (error) {
                console.error('❌ Failed to initialize renderer:', error);
                document.getElementById('app').innerHTML = `
                    <div style="color: red; padding: 20px;">
                        <h3>Error Loading Graph Renderer</h3>
                        <p>${error.message}</p>
                        <p>Make sure the WASM module is built: <code>bash scripts/build-engine.sh</code></p>
                    </div>
                `;
            }
        })();

    </script>
</body>

</html>
